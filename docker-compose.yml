services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: approva
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - approva_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d approva"]
      interval: 5s
      timeout: 5s
      retries: 10

  approva-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/approva?schema=public
      APPROVA_RUNTIME_MODE: open-core
      APPROVA_SELF_HOST_MODE: "true"
      APPROVA_DEFAULT_ORGANIZATION_NAME: Default Organization
      APPROVA_DEFAULT_ORGANIZATION_SLUG: default
      APPROVAL_UI_BASE_URL: http://localhost:3000
      CAPABILITY_TTL_MINUTES: 15
      APPROVAL_ACCESS_TOKEN_SECRET: change-me-approval-access
      WEBHOOK_SIGNING_SECRET: change-me-webhook
      PASSKEY_RP_NAME: Approva
      PASSKEY_RP_ID: localhost
      PASSKEY_EXPECTED_ORIGINS: http://localhost:3000
      APPROVER_SESSION_TTL_MINUTES: 480
      PASSKEY_CHALLENGE_TTL_MINUTES: 5
      APPROVA_RATE_LIMIT_ENABLED: "true"
      APPROVA_RATE_LIMIT_GLOBAL: 60
      APPROVA_RATE_LIMIT_AUTHENTICATED: 300
    command: >
      sh -lc "pnpm prisma db push --accept-data-loss --skip-generate && pnpm prisma db seed && pnpm --filter @approva/api start"
    ports:
      - "4000:4000"

  approva-console:
    build:
      context: .
      dockerfile: apps/approval-ui/Dockerfile
    restart: unless-stopped
    depends_on:
      approva-api:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/approva?schema=public
      APPROVA_RUNTIME_MODE: open-core
      APPROVA_SELF_HOST_MODE: "true"
      APPROVA_DEFAULT_ORGANIZATION_NAME: Default Organization
      APPROVA_DEFAULT_ORGANIZATION_SLUG: default
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      APPROVA_INTERNAL_API_BASE_URL: http://approva-api:4000
      AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"

volumes:
  approva_pgdata:
